<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">Weekly Flow architecture map</title>
  <desc id="desc">System architecture showing the mobile app, AI provider, Cloudflare Worker, KV, D1, RevenueCat, Apple, Google Calendar, and Sentry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EDF8F1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2B566D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2E9BD6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4CA66A"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#C47A00"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6D57B8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1178" height="678" rx="29" fill="url(#bg)" stroke="#DBEAF0" stroke-width="2"/>
  <text x="54" y="64" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="850">System Architecture</text>
  <text x="54" y="96" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Local-first mobile scheduling, constrained AI, and a server-side trust boundary.</text>

  <g transform="translate(54 144)" filter="url(#shadow)">
    <rect x="0" y="0" width="286" height="410" rx="24" fill="#FFFFFF" stroke="#E4EDF2"/>
    <text x="28" y="42" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Mobile App</text>
    <text x="28" y="70" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Expo + React Native + TypeScript</text>

    <rect x="28" y="104" width="230" height="58" rx="15" fill="#EAF7FF"/>
    <text x="48" y="137" fill="#245875" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">ScheduleContext</text>
    <text x="48" y="155" fill="#567386" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Activities, blocks, options, history</text>

    <rect x="28" y="178" width="230" height="58" rx="15" fill="#EAF7EF"/>
    <text x="48" y="211" fill="#23633B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Local Scheduler</text>
    <text x="48" y="229" fill="#567386" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">Timing + directional sequence fit</text>

    <rect x="28" y="252" width="230" height="58" rx="15" fill="#FFF3D7"/>
    <text x="48" y="285" fill="#945E00" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">AI Client</text>
    <text x="48" y="303" fill="#567386" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">OCR, classify, rerank, sanitize</text>

    <rect x="28" y="326" width="230" height="58" rx="15" fill="#F2EEFF"/>
    <text x="48" y="359" fill="#5C43A8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">Device Storage</text>
    <text x="48" y="377" fill="#567386" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">AsyncStorage + SecureStore</text>
  </g>

  <g transform="translate(454 154)" filter="url(#shadow)">
    <rect x="0" y="0" width="292" height="390" rx="24" fill="#FFFFFF" stroke="#E4EDF2"/>
    <text x="28" y="42" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Cloudflare Worker</text>
    <text x="28" y="70" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Production trust boundary</text>

    <rect x="28" y="104" width="236" height="48" rx="14" fill="#EAF7FF"/>
    <text x="48" y="134" fill="#245875" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">/v1/ai + /v1/embed</text>

    <rect x="28" y="166" width="236" height="48" rx="14" fill="#EAF7EF"/>
    <text x="48" y="196" fill="#23633B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">Credit + premium checks</text>

    <rect x="28" y="228" width="236" height="48" rx="14" fill="#FFF3D7"/>
    <text x="48" y="258" fill="#945E00" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">/v1/events + /v1/vocab</text>

    <rect x="28" y="290" width="236" height="48" rx="14" fill="#F2EEFF"/>
    <text x="48" y="320" fill="#5C43A8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">/v1/auth + /v1/sync</text>
  </g>

  <g transform="translate(846 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="278" height="82" rx="22" fill="#FFFFFF" stroke="#E4EDF2"/>
    <text x="26" y="35" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">OpenRouter + Workers AI</text>
    <text x="26" y="59" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Vision, rerank, and 384-dim embeddings</text>
  </g>

  <g transform="translate(846 230)" filter="url(#shadow)">
    <rect x="0" y="0" width="278" height="82" rx="22" fill="#FFFFFF" stroke="#E4EDF2"/>
    <text x="26" y="35" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">KV + D1</text>
    <text x="26" y="59" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Credits, analytics, saved plans, history</text>
  </g>

  <g transform="translate(846 340)" filter="url(#shadow)">
    <rect x="0" y="0" width="278" height="82" rx="22" fill="#FFFFFF" stroke="#E4EDF2"/>
    <text x="26" y="35" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">RevenueCat + Identity</text>
    <text x="26" y="59" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Subscriptions, Apple + Google verification</text>
  </g>

  <g transform="translate(846 450)" filter="url(#shadow)">
    <rect x="0" y="0" width="278" height="82" rx="22" fill="#FFFFFF" stroke="#E4EDF2"/>
    <text x="26" y="35" fill="#183346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">Google Calendar</text>
    <text x="26" y="59" fill="#5F788B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">OAuth import, push, and reconcile</text>
  </g>

  <path d="M340 350 H454" stroke="#2E9BD6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="365" y="334" fill="#2E9BD6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">proxy calls</text>

  <path d="M746 282 C790 262 806 161 846 161" stroke="#2E9BD6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="758" y="228" fill="#2E9BD6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">server-held keys</text>

  <path d="M746 344 C790 344 806 271 846 271" stroke="#4CA66A" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M746 468 C790 468 806 381 846 381" stroke="#C47A00" stroke-width="3" fill="none" marker-end="url(#arrowGold)"/>
  <path d="M340 468 C492 594 742 604 846 492" stroke="#6D57B8" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrowPurple)"/>
  <rect x="468" y="542" width="210" height="24" rx="12" fill="#F7F5FF"/>
  <text x="482" y="559" fill="#6D57B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">user-consented Google sync</text>

  <g transform="translate(54 594)">
    <rect x="0" y="0" width="1070" height="42" rx="21" fill="#FFFFFF" stroke="#E4EDF2" opacity="0.92"/>
    <text x="24" y="27" fill="#405A6E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Design rule: the model can suggest, but local validation decides. Fixed blocks, off-days, wake/sleep bounds, and locked events are enforced in code.</text>
  </g>
</svg>
